<!DOCTYPE html>
<html>
<head>
    <title>FORMULARIO HTML</title>
</head>

<body>
<a href="index.html">REGRESAR</a>
<h1 align="center">
    <font color="CAFE">FORMULARIO HTML</font>
</h1>

<hr>
<br><br>

<form>

    <label>Nombre:</label>
    <input type="text" name="nombre">
    <br><br>

    <label>Apellidos:</label>
    <input type="text" name="apellidos">
    <br><br>

    <label>Correo electrónico:</label>
    <input type="email" name="correo">
    <br><br>

    <label>Teléfono:</label>
    <input type="tel" name="telefono">
    <br><br>

    <label>Fecha de Nacimiento:</label>

    <select name="dia">
        <option>Día</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        
    </select>

    <select name="mes">
        <option>Mes</option>
        <option>Enero</option>
        <option>Febrero</option>
        <option>Marzo</option>
        <option>Abril</option>
        <option>Mayo</option>
        <option>Junio</option>
        <option>Julio</option>
        <option>Agosto</option>
        <option>Septiembre</option>
        <option>Octubre</option>
        <option>Noviembre</option>
        <option>Diciembre</option>
    </select>

    <select name="anio">
        <option>Año</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        
    </select>

    <br><br>

    <label>Link de Facebook:</label>
    <input type="url" name="facebook">
    <br><br>

    <label>Contraseña:</label>
    <input type="password" name="contrasena">
    <br><br>

    <label>Observaciones:</label>
    <textarea name="observaciones"></textarea>
    <br><br>

    <label>Número de Hermanos:</label>
    <input type="number" name="hermanos">
    <br><br>

    <label>Género:</label>
    <select name="genero">
        <option>Seleccione</option>
        <option>Masculino</option>
        <option>Femenino</option>
        <option>Otro</option>
    </select>
    <br><br>

    <label>Semestre:</label>
    <select name="semestre">
        <option>Seleccione</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
    </select>
    <br><br>

    <label>Carrera:</label>
    <input list="carreras" name="carrera">

    <datalist id="carreras">
        <option value="Informática">
        <option value="Programación">
        <option value="Administración">
        <option value="Contabilidad">
    </datalist>

    <br><br>

    <input type="hidden" name="Matricula" value="123456">

    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">

</form>

</body>
</html>
